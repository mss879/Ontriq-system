# Netlify builds Next.js with its OpenNext-based adapter automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Next.js keeps the Server Actions key in this server-only manifest. It never
  # reaches the browser, so the scan skips this one file and checks all others.
  SECRETS_SCAN_OMIT_PATHS = "**/server-reference-manifest.js,**/server-reference-manifest.json"

[functions]
  node_bundler = "esbuild"

# Background worker (15-minute budget): AI jobs, PDF rendering, email.
[functions."jobs-worker-background"]
  included_files = ["src/jobs/fonts/**"]
  external_node_modules = ["@react-pdf/renderer", "sharp", "heic-convert"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"
