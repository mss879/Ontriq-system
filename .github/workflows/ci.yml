name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Database migrations and RLS tests
        run: |
          # Whichever Postgres the runner image ships.
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          "$PG_BIN/postgres" --version
          export PATH="$PG_BIN:$PATH"
          npm run db:verify

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

      - name: Every menu page has a static shell
        run: npx tsx scripts/dev/check-static-shells.ts
